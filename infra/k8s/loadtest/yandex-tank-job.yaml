apiVersion: batch/v1
kind: Job
metadata:
  name: yandex-tank-load
  namespace: dev-ops
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: yandex-tank-load
    spec:
      restartPolicy: Never
      initContainers:
        - name: bootstrap-test-user
          image: curlimages/curl:8.8.0
          command:
            - sh
            - -c
            - |
              set -eu
              payload='{"name":"Tank User","login":"tank-user","password":"tank-pass-123"}'
              for i in $(seq 1 60); do
                code="$(curl -s -o /dev/null -w "%{http_code}" \
                  -H 'Content-Type: application/json' \
                  -X POST http://server:8080/api/auth/register \
                  -d "$payload" || true)"
                if [ "$code" = "200" ] || [ "$code" = "201" ] || [ "$code" = "409" ]; then
                  echo "register status: $code"
                  exit 0
                fi
                echo "waiting for backend, status=$code"
                sleep 5
              done
              echo "backend is not reachable"
              exit 1
        - name: prepare-loadtest-files
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              cp /config/load.yaml /work/load.yaml
              cp /config/ammo.txt /work/ammo.txt
          volumeMounts:
            - name: yandex-tank-config
              mountPath: /config
              readOnly: true
            - name: yandex-tank-workdir
              mountPath: /work
      containers:
        - name: yandex-tank
          image: yandex/yandex-tank:latest
          imagePullPolicy: IfNotPresent
          command:
            - yandex-tank
            - -c
            - /var/loadtest/load.yaml
          volumeMounts:
            - name: yandex-tank-workdir
              mountPath: /var/loadtest
      volumes:
        - name: yandex-tank-config
          configMap:
            name: yandex-tank-config
        - name: yandex-tank-workdir
          emptyDir: {}
