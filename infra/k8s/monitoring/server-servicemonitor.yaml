apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: server
  namespace: dev-ops
  labels:
    app: server
spec:
  namespaceSelector:
    matchNames:
      - dev-ops
  selector:
    matchLabels:
      app: server
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s
