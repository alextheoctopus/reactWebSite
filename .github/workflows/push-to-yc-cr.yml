name: Push Docker Images To Yandex Cloud CR

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CR_REGISTRY: ${{ secrets.YC_CR_REGISTRY_ID }}
      SERVER_REPOSITORY: ${{ vars.YC_CR_SERVER_REPOSITORY }}
      CLIENT_REPOSITORY: ${{ vars.YC_CR_CLIENT_REPOSITORY }}
      IMAGE_TAG: ${{ github.event.release.tag_name || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to Yandex Cloud Container Registry
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Validate registry config
        run: |
          for v in CR_REGISTRY SERVER_REPOSITORY CLIENT_REPOSITORY; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing required value: $v"
              exit 1
            fi
          done

      - name: Build and push backend image
        run: |
          docker build \
            -t cr.yandex/$CR_REGISTRY/$SERVER_REPOSITORY:$IMAGE_TAG \
            ./server
          docker push cr.yandex/$CR_REGISTRY/$SERVER_REPOSITORY:$IMAGE_TAG

      - name: Build and push frontend image
        run: |
          docker build \
            --build-arg REACT_APP_API_URL= \
            -t cr.yandex/$CR_REGISTRY/$CLIENT_REPOSITORY:$IMAGE_TAG \
            ./client
          docker push cr.yandex/$CR_REGISTRY/$CLIENT_REPOSITORY:$IMAGE_TAG
