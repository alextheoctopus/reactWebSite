name: CI-CD

on:
  push:
    branches:
      - main
      - master
      - devops-L01
      - lab-04-local
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: cr.yandex
  REGISTRY_ID: crpc8d4d2ov5uvmf14qe
  SERVER_IMAGE_NAME: reactwebsite-server
  CLIENT_IMAGE_NAME: reactwebsite-client
  MANIFEST_SERVER_PATH: infra/k8s/server.yaml
  MANIFEST_CLIENT_PATH: infra/k8s/client.yaml

jobs:
  backend_build:
    name: Backend - Build
    runs-on: ubuntu-latest
    needs: backend_test
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build backend
        run: mvn -B -DskipTests package

  notify_backend_build:
    name: Notify - Backend Build
    runs-on: ubuntu-latest
    needs: backend_build
    if: always() && github.event_name == 'push'
    steps:
      - name: Send Telegram message
        run: |
          STATUS="${{ needs.backend_build.result }}"
          ICON="ℹ️"
          if [ "$STATUS" = "success" ]; then ICON="✅"; fi
          if [ "$STATUS" = "failure" ]; then ICON="❌"; fi
          if [ "$STATUS" = "skipped" ]; then ICON="⏭️"; fi

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="${ICON} Backend Build: ${STATUS}%0ARepo: ${{ github.repository }}%0ABranch: ${{ github.ref_name }}%0ACommit: ${{ github.sha }}"

  backend_test:
    name: Backend - Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests with coverage
        run: mvn -B clean verify jacoco:report

      - name: Upload backend test reports
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            server/target/site/jacoco
            server/target/surefire-reports

  notify_backend_test:
    name: Notify - Backend Test
    runs-on: ubuntu-latest
    needs: backend_test
    if: always() && github.event_name == 'push'
    steps:
      - name: Send Telegram message
        run: |
          STATUS="${{ needs.backend_test.result }}"
          ICON="ℹ️"
          if [ "$STATUS" = "success" ]; then ICON="✅"; fi
          if [ "$STATUS" = "failure" ]; then ICON="❌"; fi
          if [ "$STATUS" = "skipped" ]; then ICON="⏭️"; fi

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="${ICON} Backend Test: ${STATUS}%0ARepo: ${{ github.repository }}%0ABranch: ${{ github.ref_name }}%0ACommit: ${{ github.sha }}"

  frontend_build:
    name: Frontend - Build
    runs-on: ubuntu-latest
    needs: frontend_test
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build frontend
        run: npm run build

  notify_frontend_build:
    name: Notify - Frontend Build
    runs-on: ubuntu-latest
    needs: frontend_build
    if: always() && github.event_name == 'push'
    steps:
      - name: Send Telegram message
        run: |
          STATUS="${{ needs.frontend_build.result }}"
          ICON="ℹ️"
          if [ "$STATUS" = "success" ]; then ICON="✅"; fi
          if [ "$STATUS" = "failure" ]; then ICON="❌"; fi
          if [ "$STATUS" = "skipped" ]; then ICON="⏭️"; fi

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="${ICON} Frontend Build: ${STATUS}%0ARepo: ${{ github.repository }}%0ABranch: ${{ github.ref_name }}%0ACommit: ${{ github.sha }}"

  frontend_test:
    name: Frontend - Test
    runs-on: ubuntu-latest
    needs: backend_build
    defaults:
      run:
        working-directory: client
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Run frontend tests with coverage
        run: npm test -- --watchAll=false --coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: client/coverage

  notify_frontend_test:
    name: Notify - Frontend Test
    runs-on: ubuntu-latest
    needs: frontend_test
    if: always() && github.event_name == 'push'
    steps:
      - name: Send Telegram message
        run: |
          STATUS="${{ needs.frontend_test.result }}"
          ICON="ℹ️"
          if [ "$STATUS" = "success" ]; then ICON="✅"; fi
          if [ "$STATUS" = "failure" ]; then ICON="❌"; fi
          if [ "$STATUS" = "skipped" ]; then ICON="⏭️"; fi

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="${ICON} Frontend Test: ${STATUS}%0ARepo: ${{ github.repository }}%0ABranch: ${{ github.ref_name }}%0ACommit: ${{ github.sha }}"

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs:
      - frontend_build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Download backend reports
        uses: actions/download-artifact@v4
        with:
          name: backend-test-reports
          path: server/target

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: client/coverage

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  notify_sonarqube:
    name: Notify - SonarQube
    runs-on: ubuntu-latest
    needs: sonarqube
    if: always() && github.event_name == 'push'
    steps:
      - name: Send Telegram message
        run: |
          STATUS="${{ needs.sonarqube.result }}"
          ICON="ℹ️"
          if [ "$STATUS" = "success" ]; then ICON="✅"; fi
          if [ "$STATUS" = "failure" ]; then ICON="❌"; fi
          if [ "$STATUS" = "skipped" ]; then ICON="⏭️"; fi

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="${ICON} SonarQube: ${STATUS}%0ARepo: ${{ github.repository }}%0ABranch: ${{ github.ref_name }}%0ACommit: ${{ github.sha }}"

  docker_build_and_push:
    name: Docker - Build and Push
    runs-on: ubuntu-latest
    needs:
      - sonarqube
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags
        run: |
          echo "SERVER_IMAGE=${{ env.REGISTRY }}/${{ env.REGISTRY_ID }}/${{ env.SERVER_IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_ENV
          echo "CLIENT_IMAGE=${{ env.REGISTRY }}/${{ env.REGISTRY_ID }}/${{ env.CLIENT_IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_ENV
          echo "SERVER_IMAGE_LATEST=${{ env.REGISTRY }}/${{ env.REGISTRY_ID }}/${{ env.SERVER_IMAGE_NAME }}:latest" >> $GITHUB_ENV
          echo "CLIENT_IMAGE_LATEST=${{ env.REGISTRY }}/${{ env.REGISTRY_ID }}/${{ env.CLIENT_IMAGE_NAME }}:latest" >> $GITHUB_ENV

      - name: Log in to Yandex Container Registry
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: oauth
          password: ${{ secrets.YC_OAUTH_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ env.SERVER_IMAGE }}
            ${{ env.SERVER_IMAGE_LATEST }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          tags: |
            ${{ env.CLIENT_IMAGE }}
            ${{ env.CLIENT_IMAGE_LATEST }}

  notify_docker_build_and_push:
    name: Notify - Docker Build and Push
    runs-on: ubuntu-latest
    needs: docker_build_and_push
    if: always() && github.event_name == 'push'
    steps:
      - name: Send Telegram message
        run: |
          STATUS="${{ needs.docker_build_and_push.result }}"
          ICON="ℹ️"
          if [ "$STATUS" = "success" ]; then ICON="✅"; fi
          if [ "$STATUS" = "failure" ]; then ICON="❌"; fi
          if [ "$STATUS" = "skipped" ]; then ICON="⏭️"; fi

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="${ICON} Docker Build and Push: ${STATUS}%0ARepo: ${{ github.repository }}%0ABranch: ${{ github.ref_name }}%0ACommit: ${{ github.sha }}"

  update_manifests:
    name: Update K8s manifests
    runs-on: ubuntu-latest
    needs:
      - docker_build_and_push
    if: needs.docker_build_and_push.result == 'success' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update server image in manifest
        run: |
          sed -i "s|image: .*reactwebsite-server:.*|image: ${{ env.REGISTRY }}/${{ env.REGISTRY_ID }}/${{ env.SERVER_IMAGE_NAME }}:${{ github.sha }}|" "${{ env.MANIFEST_SERVER_PATH }}"

      - name: Update client image in manifest
        run: |
          sed -i "s|image: .*reactwebsite-client:.*|image: ${{ env.REGISTRY }}/${{ env.REGISTRY_ID }}/${{ env.CLIENT_IMAGE_NAME }}:${{ github.sha }}|" "${{ env.MANIFEST_CLIENT_PATH }}"

      - name: Commit and push manifest changes
        run: |
          git add "${{ env.MANIFEST_SERVER_PATH }}" "${{ env.MANIFEST_CLIENT_PATH }}"
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "ci: update manifests to ${{ github.sha }} [skip ci]"
          git push

  notify_update_manifests:
    name: Notify - Update Manifests
    runs-on: ubuntu-latest
    needs: update_manifests
    if: always() && github.event_name == 'push'
    steps:
      - name: Send Telegram message
        run: |
          STATUS="${{ needs.update_manifests.result }}"
          ICON="ℹ️"
          if [ "$STATUS" = "success" ]; then ICON="✅"; fi
          if [ "$STATUS" = "failure" ]; then ICON="❌"; fi
          if [ "$STATUS" = "skipped" ]; then ICON="⏭️"; fi

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="${ICON} Update Manifests: ${STATUS}%0ARepo: ${{ github.repository }}%0ABranch: ${{ github.ref_name }}%0ACommit: ${{ github.sha }}"

  notify_summary_success:
    name: Notify - Summary Success
    runs-on: ubuntu-latest
    needs:
      - backend_build
      - backend_test
      - frontend_build
      - frontend_test
      - sonarqube
      - docker_build_and_push
      - update_manifests
    if: success() && github.event_name == 'push'
    steps:
      - name: Send Telegram success summary
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="✅ Workflow passed: ${{ github.repository }}%0ABranch: ${{ github.ref_name }}%0ACommit: ${{ github.sha }}"

  notify_summary_failure:
    name: Notify - Summary Failure
    runs-on: ubuntu-latest
    needs:
      - backend_build
      - backend_test
      - frontend_build
      - frontend_test
      - sonarqube
      - docker_build_and_push
      - update_manifests
    if: failure() && github.event_name == 'push'
    steps:
      - name: Send Telegram failure summary
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ Workflow failed: ${{ github.repository }}%0ABranch: ${{ github.ref_name }}%0ACommit: ${{ github.sha }}"