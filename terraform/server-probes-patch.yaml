spec:
  template:
    spec:
      containers:
        - name: server
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 240
            periodSeconds: 15
            failureThreshold: 6
